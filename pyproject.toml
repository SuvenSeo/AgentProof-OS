[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof-os"
version = "0.1.0"
description = "Local-first safety, audit, and governance for AI-built software."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suven Seoras" }]
keywords = ["ai-agents", "mcp", "security", "cli", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentproof = "agentproof.cli:main"

[tool.setuptools.packages.find]
include = ["agentproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
