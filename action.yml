name: AgentProof OS
description: Scan a repository for AI-agent and MCP safety risks.
author: Suven Seoras
inputs:
  path:
    description: Path to scan
    required: false
    default: .
  fail-on:
    description: Minimum severity that should fail the job
    required: false
    default: high
  format:
    description: Output format
    required: false
    default: sarif
  output:
    description: Report output path
    required: false
    default: agentproof.sarif
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install AgentProof OS
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Run AgentProof OS
      shell: bash
      run: agentproof scan "${{ inputs.path }}" --format "${{ inputs.format }}" --output "${{ inputs.output }}" --fail-on "${{ inputs.fail-on }}"
